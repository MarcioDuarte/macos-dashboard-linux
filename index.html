<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HiTab Style Dashboard</title>
    <style>
        /* Reset e Design System */
        :root {
            --widget-bg: rgba(28, 28, 30, 0.5);
            --widget-blur: blur(20px) saturate(180%);
            --widget-border: 1px solid rgba(255, 255, 255, 0.12);
            --widget-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --widget-radius: 22px;
            --accent-red: #ff453a;
            --accent-blue: #007aff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: url('images/back.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ddd;
            overflow: hidden;
            height: 100vh;
        }

        /* Dashboard Layout */
        .dashboard {
            position: fixed;
            top: 50px;
            /* Rebaixado conforme solicitado */
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-end;
            gap: 16px;
            padding: 10px;
            z-index: 1000;
            height: 730px !important;
        }

        /* Widget Base */
        .stats-widget,
        .apple-weather-widget,
        .clock-widget,
        .mac-calendar-widget {
            background: var(--widget-bg) !important;
            backdrop-filter: var(--widget-blur) !important;
            -webkit-backdrop-filter: var(--widget-blur) !important;
            border: var(--widget-border) !important;
            box-shadow: var(--widget-shadow) !important;
            border-radius: var(--widget-radius) !important;
            width: 330px !important;
            margin: 0 !important;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border 0.3s ease;
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .stats-widget:hover,
        .apple-weather-widget:hover,
        .clock-widget:hover,
        .mac-calendar-widget:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .dashboard>*:nth-child(1) {
            animation-delay: 0.1s;
        }

        .dashboard>*:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dashboard>*:nth-child(3) {
            animation-delay: 0.3s;
        }

        .dashboard>*:nth-child(4) {
            animation-delay: 0.4s;
        }


        /* -------------------------------------
   2. WIDGET: RELÓGIO
------------------------------------- */
        .clock-widget {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 158px;
            /* Mantido fixo para o relógio */
        }

        .time-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-top: -6%;
        }

        .main-time {
            font-size: 5.5rem;
            letter-spacing: -2px;
            color: white;
            font-family: "Fjalla One", sans-serif;
        }

        .seconds {
            font-size: 3.3rem;
            margin-left: 2px;
            color: white;
            font-family: "Fjalla One", sans-serif;
        }

        .info-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 10px;
            color: white;
        }

        .location-name {
            font-size: 0.9rem;
            text-align: right;
            color: white;
            width: 100%;
            margin-right: 20px;
            font-weight: 700;
        }

        .timezone {
            font-size: 0.9rem;
            margin: 0;
            color: white;
            width: 100%;
        }

        /* -------------------------------------
   3. WIDGET: CALENDÁRIO (Clássico)
------------------------------------- */
        .calendar-widget {
            color: white;
            padding: 25px;
            display: flex;
            min-height: 200px;
            height: 200px;
        }

        .date-highlight {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            margin: -25px 0 -26px -24px;
            border-radius: 22px 0 0 22px;
        }

        .blue-text {
            color: var(--accent-red) !important;
            text-transform: uppercase;
            font-size: 1.4rem;
            margin: 0;
            font-weight: 500;
            text-align: center;
        }

        #month-name {
            font-size: 1.2rem;
            margin: 10px 0 5px 0;
            font-weight: 500;
            text-align: center;
        }

        #day-number {
            font-size: 5rem;
            margin: 0;
            font-weight: 500;
            text-align: center;
        }

        .month-grid {
            flex: 1.2;
            padding-left: 21px;
            margin-top: -2px;
        }

        .days-header,
        .days-numbers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 0px 5px;
        }

        .days-header {
            color: rgba(255, 255, 255, 0.4);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.8rem;
            margin-top: -13px;
        }

        .days-numbers {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: -8px;
        }

        .days-numbers span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            width: 28px;
            border-radius: 50%;
        }

        .current-day {
            background-color: var(--accent-blue) !important;
            color: white !important;
        }

        /* -------------------------------------
   4. WIDGET: CLIMA (Apple Style)
------------------------------------- */
        .apple-weather-widget {
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            height: 330px;
        }

        .aw-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: -15px;
        }

        .aw-city {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .aw-temp {
            font-size: 58px;
            font-weight: 300;
            line-height: 1;
            margin-top: -5px;
        }

        .aw-cond-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .aw-cond-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
        }

        .aw-cond-text {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .aw-cond-hl {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
        }

        .aw-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 15px 0;
        }

        .aw-hourly {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }

        .aw-hour-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .aw-hour-time {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.8;
        }

        .aw-hour-icon {
            width: 22px;
            height: 22px;
        }

        .aw-hour-temp {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .aw-daily {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .aw-day-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .aw-day-name {
            width: 40px;
            opacity: 0.8;
        }

        .aw-day-icon {
            width: 22px;
            height: 22px;
            margin-left: 20px;
            margin-right: 20px;
        }

        .aw-day-min {
            width: 25px;
            text-align: right;
            opacity: 0.6;
            margin-left: 15px;
        }

        .aw-day-max {
            width: 25px;
            text-align: right;
        }

        .aw-temp-bar {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 15px;
            position: relative;
            overflow: hidden;
        }

        .aw-temp-fill {
            position: absolute;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #81c784 0%, #ffd54f 100%);
        }

        .divider {
            display: block;
            margin: 8px 0;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* -------------------------------------
   5. WIDGET: CALENDÁRIO (macOS Style)
------------------------------------- */
        .mac-calendar-widget {
            color: white;
            padding: 12px 15px;
            min-height: 158px;
            /* Altura mínima base */
            height: auto;
            /* Cresce conforme a necessidade (ex: 6 semanas) */
            display: flex;
            box-sizing: border-box;
        }

        .mc-red-text {
            color: var(--accent-red);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: -4px 0px 5px 8px;
        }

        .mc-left {
            width: 35%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #mc-day-number {
            font-size: 54px;
            font-weight: 300;
            line-height: 1;
            margin: 0 0 auto 0;
        }

        .mc-events-text {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin: 0;
        }

        .mc-right {
            width: 65%;
            display: flex;
            flex-direction: column;
            padding-left: 20px;
        }

        .mc-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            margin-top: 1px;
        }

        .mc-grid-numbers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 1px 5px;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
        }

        .mc-grid-numbers span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            /* Reduzido de 19px para ganhar espaço vertical */
            width: 18px;
            border-radius: 50%;
            margin: 0 auto;
        }

        .mc-current-day {
            background-color: var(--accent-red);
            color: white;
            font-weight: 600;
        }

        /* -------------------------------------
   6. WIDGET: SISTEMA (EUL Style)
------------------------------------- */
        /* -------------------------------------
   6. WIDGET: SISTEMA (Stats Style)
------------------------------------- */
        .stats-widget {
            padding: 18px;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .stats-header-circles {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            margin-bottom: 5px;
        }

        .stats-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .stats-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            font-size: 11px;
            font-weight: 600;
        }

        /* O progresso é feito via conic-gradient no JS */
        .stats-circle::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: var(--widget-bg);
            border-radius: 50%;
            z-index: 0;
        }

        .stats-circle span {
            position: relative;
            z-index: 1;
        }

        .stats-circle-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-section-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .stats-row span:last-child {
            color: white;
            font-weight: 500;
        }

        .stats-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stats-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
        }

        /* Gráfico de barras do CPU */
        .stats-cpu-state {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 18px;
            padding: 2px 0;
        }

        .stats-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
            height: 100%;
            transition: height 0.3s ease, background 0.3s ease;
        }

        .stats-bar.active {
            background: #4cd964;
        }

        .stats-chip-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .stats-proc-list {
            margin-top: 5px;
        }

        .stats-proc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 11px;
        }

        .stats-proc-name {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stats-proc-icon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
        }

        .stats-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-net-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

            "50n": "nevoa.png"
        };

        function formatHour(timestamp, timezoneOffsetSeconds) {
            const date = new Date((timestamp + timezoneOffsetSeconds) * 1000);
            return new Intl.DateTimeFormat('pt-BR', {
                hour: 'numeric', hour12: false, timeZone: 'UTC'
            }).format(date) + "h";
        }

        function getDayName(timestamp, timezoneOffsetSeconds) {
            const date = new Date((timestamp + timezoneOffsetSeconds) * 1000);
            return new Intl.DateTimeFormat('pt-BR', { weekday: 'short', timeZone: 'UTC' }).format(date).charAt(0).toUpperCase() + new Intl.DateTimeFormat('pt-BR', { weekday: 'short', timeZone: 'UTC' }).format(date).slice(1).replace(".", "");
        }

        async function fetchWeather() {
            // 2. INFRAESTRUTURA: Fallback rígido para Curitiba caso a geolocalização do Electron falhe
            const lat = -25.375659;
            const lon = -49.254046;

            try {
                // CORREÇÃO CRÍTICA: Removemos o 'daily' do exclude para receber a previsão semanal
                const url = `https://api.openweathermap.org/data/3.0/onecall?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&exclude=minutely,alerts&appid=${apiKey}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Erro HTTP: " + res.status);
                const data = await res.json();

                // Busca nome da cidade
                const geoUrl = `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&lang=pt_br&limit=1&appid=${apiKey}`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();
                const city = geoData[0]?.name || "Localização";

                // 3. INJEÇÃO DO HEADER (Mapeando para as novas classes do HTML)
                document.getElementById("aw-city").textContent = city;
                document.getElementById("aw-temp").textContent = `${Math.round(data.current.temp)}°`;
                document.getElementById("aw-desc").textContent = data.current.weather[0].description.charAt(0).toUpperCase() + data.current.weather[0].description.slice(1);
                document.getElementById("aw-hl").textContent = `H:${Math.round(data.daily[0].temp.max)}° L:${Math.round(data.daily[0].temp.min)}°`;

                // Troca a tag de imagem por um elemento de texto para suportar seus emojis
                // Localize onde você atualiza o ícone principal e substitua por isso:
                const mainIconName = iconMap[data.current.weather[0].icon] || "nublado.png";
                const mainIconContainer = document.getElementById("aw-icon-main");

                // Mantendo a estrutura, mas injetando a imagem
                mainIconContainer.innerHTML = `<img src="${iconPath}${mainIconName}" style="width: 32px; height: 32px; object-fit: contain;">`;


                // 4. PREVISÃO HORÁRIA (Hourly)
                const sunrise = data.current.sunrise;
                const sunset = data.current.sunset;
                const timezoneOffset = data.timezone_offset;

                // 4. PREVISÃO HORÁRIA (Hourly)
                let hourlyData = data.hourly.slice(0, 12); // Aumentei para 12h para garantir que pegamos o evento

                // ALGORITMO DE INSERÇÃO: Criamos objetos falsos de "hora" para o sol
                const sunEvents = [];
                if (sunrise > hourlyData[0].dt && sunrise < hourlyData[hourlyData.length - 1].dt) {
                    sunEvents.push({ dt: sunrise, isSunEvent: true, type: 'sunrise', label: 'Nascer do Sol' });
                }
                if (sunset > hourlyData[0].dt && sunset < hourlyData[hourlyData.length - 1].dt) {
                    sunEvents.push({ dt: sunset, isSunEvent: true, type: 'sunset', label: 'Pôr do Sol' });
                }

                // Mescla, ordena por tempo e pega os primeiros 6 itens para o display
                const finalTimeline = [...hourlyData, ...sunEvents]
                    .sort((a, b) => a.dt - b.dt)
                    .slice(0, 6);

                const hourlyContainer = document.getElementById("aw-hourly-container");

                hourlyContainer.innerHTML = finalTimeline.map((item, index) => {
                    // Se for um evento solar
                    if (item.isSunEvent) {
                        const icon = item.type === 'sunrise' ? 'nascer-do-sol.png' : 'por-do-sol.png';
                        return `
            <div class="aw-hour-block">
                <span class="aw-hour-time">${formatHour(item.dt, timezoneOffset)}</span>
                <img src="${iconPath}${icon}" style="width: 20px; height: 20px;">
                <span class="aw-hour-temp" style="font-size: 10px;">${item.label}</span>
            </div>
        `;
                    }

                    // Se for uma hora normal (seu código original adaptado)
                    const hrIcon = iconMap[item.weather[0].icon] || "nublado.png";
                    const displayHour = formatHour(item.dt, timezoneOffset);
                    return `
        <div class="aw-hour-block">
            <span class="aw-hour-time">${displayHour}</span>
            <img src="${iconPath}${hrIcon}" style="width: 20px; height: 20px;">
            <span class="aw-hour-temp">${Math.round(item.temp)}°</span>
        </div>
    `;
                }).join('');

                // 5. O ALGORITMO DAS BARRAS DE TEMPERATURA (Daily)
                const dailyData = data.daily.slice(1, 6); // Próximos 5 dias

                // Passo A: Descobrir o limite absoluto de temperatura da semana inteira
                const allMinTemps = dailyData.map(d => d.temp.min);
                const allMaxTemps = dailyData.map(d => d.temp.max);
                const weekMin = Math.min(...allMinTemps);
                const weekMax = Math.max(...allMaxTemps);
                const weekRange = weekMax - weekMin; // Amplitude térmica total da semana

                const dailyContainer = document.getElementById("aw-daily-container");

                dailyContainer.innerHTML = dailyData.map(day => {
                    const dayMin = Math.round(day.temp.min);
                    const dayMax = Math.round(day.temp.max);

                    const dayIcon = iconMap[day.weather[0].icon] || "nublado.png";
                    // Passo B: Calcular a geometria da barra
                    // Onde a barra começa (Margem Esquerda %)
                    const leftPercent = ((dayMin - weekMin) / weekRange) * 100;
                    // Qual o tamanho da barra (Largura %)
                    const widthPercent = ((dayMax - dayMin) / weekRange) * 100;

                    return `
                <div class="aw-day-row">
                    <span class="aw-day-name">${getDayName(day.dt, timezoneOffset)}</span>
                    <span style="font-size: 0.8rem;"><img src="${iconPath}${dayIcon}" style="width: 18px; height: 18px;"></span>
                    <span class="aw-day-min">${dayMin}°</span>
                    <div class="aw-temp-bar">
                        <div class="aw-temp-fill" style="left: ${leftPercent}%; width: ${widthPercent}%;"></div>
                    </div>
                    <span class="aw-day-max">${dayMax}°</span>
                </div>
            `;
                }).join('');

            } catch (e) {
                console.error("Erro na esteira de clima:", e);
            }
        }

        // Inicia o widget
        fetchWeather();
        // Atualiza a cada 30 min silenciosamente
        setInterval(fetchWeather, 1800000);
        function updateClock() {
            const now = new Date();

            // 1. Atualiza Horas e Minutos
            const hm = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('hours-mins').textContent = hm;

            // 2. Atualiza Segundos
            const s = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('seconds').textContent = `:` + s;

            // 3. Calcula e exibe o GMT Local (Racional e Automático)
            const offset = now.getTimezoneOffset(); // Retorna em minutos (ex: 180 para -3h)
            const absOffset = Math.abs(offset);
            const hours = Math.floor(absOffset / 60);
            const minutes = absOffset % 60;
            const sign = offset <= 0 ? "+" : "-";

            const gmtString = `${sign}${hours}:${minutes.toString().padStart(2, '0')}`;
            document.getElementById('gmt-display').textContent = gmtString;
        }

        // Executa a cada segundo para precisão total
        setInterval(updateClock, 1000);
        updateClock(); // Chamada inicial imediata



        async function generateMacCalendar() {
            const now = new Date();
            const month = now.getMonth();
            const year = now.getFullYear();
            const today = now.getDate();

            const dayNames = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

            document.getElementById('mc-day-name').textContent = dayNames[now.getDay()];
            document.getElementById('mc-day-number').textContent = today;
            document.getElementById('mc-month-name').textContent = monthNames[month];

            const todayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(today).padStart(2, '0')}`;
            const eventsContainer = document.querySelector('.mc-events-text');

            try {
                // 1. Solicita ao main.js a pasta de configuração do Linux (~/.config/seu-app)
                const userDataPath = await ipcRenderer.invoke('get-user-path');

                // 2. Monta o caminho absoluto blindado
                const eventsPath = path.join(userDataPath, 'events.json');

                // 3. Auto-Cura: Se o arquivo não existir (primeira vez rodando), cria a estrutura vazia
                if (!fs.existsSync(eventsPath)) {
                    fs.writeFileSync(eventsPath, JSON.stringify([]), 'utf8');
                }

                // 4. Lê o arquivo da pasta segura
                const eventsData = await fs.promises.readFile(eventsPath, 'utf8');
                const events = JSON.parse(eventsData);

                const todayEvents = events.filter(e => e.date === todayStr);

                if (todayEvents.length > 0) {
                    eventsContainer.innerHTML = todayEvents.map(e => `• ${e.title}`).join('<br>');
                    eventsContainer.style.color = '#ffffff';
                } else {
                    eventsContainer.textContent = "No events today";
                    eventsContainer.style.color = '#98989d';
                }

            } catch (err) {
                console.error("Falha na esteira de eventos:", err);
                eventsContainer.textContent = "Erro na leitura de eventos";
                eventsContainer.style.color = '#ff453a';
            }

            // Cálculos da Grade do Calendário mantidos intactos...
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('mc-calendar-days');

            grid.innerHTML = "";

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<span></span>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === today ? 'mc-current-day' : '';
                grid.innerHTML += `<span class="${isToday}">${d}</span>`;
            }
        }

        generateMacCalendar();
        setInterval(generateMacCalendar, 3600000);







        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function updateEulWidget() {
            try {
                // Node.js OS module para dados garantidos
                const osModule = require('os');
                
                // Busca dados do SI com timeout ou fallback
                const [cpu, mem, temp, procs] = await Promise.all([
                    si.currentLoad().catch(() => ({ currentLoad: 0, currentLoadUser: 0, currentLoadSystem: 0, currentLoadIdle: 0, cpus: [] })),
                    si.mem().catch(() => ({ active: 0, total: 1 })),
                    si.cpuTemperature().catch(() => ({ main: 0 })),
                    si.processes().catch(() => ({ list: [] }))
                ]);

                // --- CIRCLES ---
                const cpuPerc = Math.round(cpu.currentLoad || 0);
                const memPerc = Math.round(((mem.active || 0) / (mem.total || 1)) * 100);
                // Disco simplificado (pega o primeiro se falhar o fsSize)
                let diskPerc = 0;
                try { 
                    const disk = await si.fsSize();
                    diskPerc = Math.round(disk[0]?.use || 0);
                } catch(e) {}

                updateCircle('circle-cpu', cpuPerc, '#4cd964');
                updateCircle('circle-mem', memPerc, '#4cd964');
                updateCircle('circle-disk', diskPerc, '#4cd964');

                // --- CPU DETAILS ---
                document.getElementById('stat-cpu-user').textContent = `${(cpu.currentLoadUser || 0).toFixed(1)}%`;
                document.getElementById('stat-cpu-sys').textContent = `${(cpu.currentLoadSystem || 0).toFixed(1)}%`;
                document.getElementById('stat-cpu-idle').textContent = `${(cpu.currentLoadIdle || 0).toFixed(1)}%`;
                
                // Animação das barras de CPU State
                const bars = document.querySelectorAll('.stats-bar');
                bars.forEach(bar => {
                    const h = Math.floor(Math.random() * 70) + 30; // Simula atividade
                    bar.style.height = h + '%';
                    if (h > 60) bar.classList.add('active');
                    else bar.classList.remove('active');
                });
                
                // Load Avg nativo do OS (mais garantido que SI em alguns sistemas)
                const loads = osModule.loadavg();
                document.getElementById('stat-load-1').textContent = loads[0].toFixed(2);
                document.getElementById('stat-load-5').textContent = loads[1].toFixed(2);
                document.getElementById('stat-load-15').textContent = loads[2].toFixed(2);

                // --- CHIP & TEMP ---
                document.getElementById('stat-temp').textContent = temp.main ? `${Math.round(temp.main)}°C` : 'N/A';
                document.getElementById('stat-cpu-name').textContent = cpu.cpus[0]?.model || 'Processor';

                // --- PROCESSES (Applications) ---
                const topProcs = (procs.list || []).sort((a, b) => b.cpu - a.cpu).slice(0, 4);
                document.getElementById('stats-procs').innerHTML = topProcs.map(p => `
                    <div class="stats-proc-item">
                        <div class="stats-proc-name">
                            <div class="stats-proc-icon"></div>
                            <span>${p.name}</span>
                        </div>
                        <span>${(p.cpu || 0).toFixed(1)}%</span>
                    </div>
                `).join('');

                // --- UPTIME ---
                const uptimeSeconds = osModule.uptime();
                const hours = Math.floor(uptimeSeconds / 3600);
                const mins = Math.floor((uptimeSeconds % 3600) / 60);
                document.getElementById('stat-uptime').textContent = `${hours}h ${mins}m`;

                // --- NETWORK ---
                try {
                    const defaultNet = await si.networkInterfaceDefault();
                    const netStats = await si.networkStats(defaultNet);
                    if (netStats && netStats.length > 0) {
                        document.getElementById('stat-net-up').textContent = formatBytes(netStats[0].tx_sec);
                        document.getElementById('stat-net-down').textContent = formatBytes(netStats[0].rx_sec);
                    }
                } catch(e) {}

            } catch (err) {
                console.error("Erro crítico no widget:", err);
            }
        }

        function updateCircle(id, percent, color) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.background = `conic-gradient(${color} ${percent * 3.6}deg, rgba(255,255,255,0.1) 0deg)`;
            el.querySelector('span').textContent = `${percent}%`;
        }

        updateEulWidget();
        setInterval(updateEulWidget, 2000);
    </script>
